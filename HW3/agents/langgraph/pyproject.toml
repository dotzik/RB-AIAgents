[project]
name = "lgagent"
version = "0.1.0"
description = "ReAct agent nad MCP serverem z HW3, postavený na LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langchain-mcp-adapters>=0.1",
    "langchain-ollama>=0.3",
    "python-dotenv>=1.0.1",
    "timeagent",
]

[project.scripts]
lgagent = "lgagent.cli:main"

[tool.uv.sources]
timeagent = { path = "../../../HW1", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgagent"]
