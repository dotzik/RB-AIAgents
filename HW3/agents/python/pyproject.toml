[project]
name = "mcpagent"
version = "0.1.0"
description = "Agent nad MCP serverem z HW3, postavený na Pydantic AI"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[mcp,openai]>=1.0.0",
    "python-dotenv>=1.0.1",
    "timeagent",
]

[project.scripts]
mcpagent = "mcpagent.cli:main"

[tool.uv.sources]
timeagent = { path = "../../../HW1", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpagent"]
