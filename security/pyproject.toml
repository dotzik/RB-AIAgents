[project]
name = "timeagent-gate"
version = "0.1.0"
description = "Autorizační gate pro MCP server timeagenta — závěrečný projekt kurzu Security for AI"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3",
    "uvicorn[standard]>=0.39.0",
    "timeagent",
    "timeagent-mcp",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv.sources]
timeagent = { path = "../HW1", editable = true }
timeagent-mcp = { path = "../HW3/mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timeagent_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Karanténa nových verzí 7 dní (supply chain, security/04-mitigace.md, M8).
exclude-newer = "7 days"
